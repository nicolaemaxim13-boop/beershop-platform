# TEST PREVIEW ONLY. Not hardened for production or real customer orders.
# Free Render Postgres expires after 30 days. Local uploads are ephemeral.
databases:
  - name: beershop-preview-db
    databaseName: beershop
    user: beershop
    plan: free
    ipAllowList: []
services:
  - type: web
    name: beershop-preview
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beershop-preview-db
          property: connectionString
      - key: BEERSHOP_ADMIN_TOKEN
        generateValue: true

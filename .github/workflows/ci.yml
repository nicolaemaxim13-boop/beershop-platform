name: BeerShop CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///./beershop_ci_test.db
      BEERSHOP_ADMIN_TOKEN: tttttttttttttttttttttttttttttttttttttttt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q
      - run: node --check web/ops40.js
      - run: node --check web/store-fx.js

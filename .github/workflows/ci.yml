name: BeerShop CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///./beershop_ci_test.db
      BEERSHOP_ADMIN_TOKEN: tttttttttttttttttttttttttttttttttttttttt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q
      - run: node --check web/ops40.js
      - run: node --check web/store-fx.js
      - run: node --check web/pricing-admin.js
      - run: node --check web/readiness-v9.js
      - run: node --check web/staff-v9.js
      - run: node --check web/own-crm-v91.js
      - run: node --check tests/own_crm_v91_browser.cjs
      - run: node --check tests/crm_v91_staff_browser.cjs
      - run: node --check tests/readiness_v9_browser.cjs
      - run: node --check web/storefront-v5.js
      - run: node --check web/storefront-v7.js
      - run: node --check web/admin-gallery-v8.js
      - run: node --check web/admin-catalog32.js
      - run: node --check tests/gallery_v8_browser.cjs
      - run: node --check web/connectors41.js
      - run: node --check web/crm.js
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: python tests/run_crm_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-browser-screenshots
          path: |
            /tmp/crm-*.png
            /tmp/inventory-*.png
            /tmp/beershop-*.png
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beershop
          POSTGRES_PASSWORD: test-fixture-only
          POSTGRES_DB: beershop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beershop -d beershop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://beershop:test-fixture-only@localhost:5432/beershop_test
      BEERSHOP_V91_ALLOW_LOCAL_POSTGRES: '1' # Isolated CI PostgreSQL only
      BEERSHOP_V94_LOCAL_PG_REHEARSAL: '1' # Explicit isolated CI-only opt in
      BEERSHOP_V94_PG_REHEARSAL_URL: postgresql://beershop:test-fixture-only@localhost:5432/beershop_v94_rehearsal
      BEERSHOP_V95_PG_MIGRATION_URL: postgresql://beershop:test-fixture-only@localhost:5432/beershop_v95_migration
      BEERSHOP_V96_PG_ENCRYPTED_RESTORE_URL: postgresql://beershop:test-fixture-only@localhost:5432/beershop_v96_encrypted_restore
      BEERSHOP_V96_PG_PREFLIGHT_URL: postgresql://beershop:test-fixture-only@localhost:5432/beershop_v96_preflight
      BEERSHOP_ADMIN_TOKEN: tttttttttttttttttttttttttttttttttttttttt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create isolated empty PostgreSQL v9.4 restore database
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://beershop:test-fixture-only@localhost:5432/postgres', autocommit=True); c.execute('CREATE DATABASE beershop_v94_rehearsal'); c.execute('CREATE DATABASE beershop_v95_migration'); c.execute('CREATE DATABASE beershop_v96_encrypted_restore'); c.execute('CREATE DATABASE beershop_v96_preflight'); c.close()"
      - run: pytest -q

